<!DOCTYPE html>
<html lang="prt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="ini1">Número 1: </label>
            <input type="number" name="num1" id="ini1" min="0" max="50" required
            oninput="isoma.innerHTML = Number(ini1.value) + Number(ini2.value)">
        </p>
        <p>
            <label for="ini2">Número 2: </label>
            <input type="number" name="num2" id="ini2" min="0" max="50" required
            oninput="isoma.innerHTML = Number(ini1.value) + Number(ini2.value)">
        <p>
            <label for="isoma">Soma: </label>
            <output name="soma" id="isoma">0</output>

        </p>
        <p>
            <input type= "submit" value="Enviar"> 
            <input type="reset" value="Limpar">
        </p>
    
</body>
</html>
