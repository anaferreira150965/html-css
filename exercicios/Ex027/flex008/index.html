<!DOCTYPE html>
<html lang="bt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        div.container {
            display: flex;
            background-color: lightcoral;
            flex-flow: row wrap;
            height: 400px;
            align-items: flex-start;

           
        }
        div.item {
            background-color: lightskyblue;
            text-align: center;
            padding: 20px;
            border: 1px solid black;
        }
        div#i1 { align-self: center; }
        div#i2 { align-self: auto; }        
        div#i3 { }
        div#i4 {align-self: self-end; }
        div#i5 { }
        div#i6 { align-self: stretch;}
        div#i7 {  }
        
    </style>

</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div> 
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>

    
</body>
</html>
