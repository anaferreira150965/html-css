<!DOCTYPE html>
<html lang="bt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        div.container {
            display: flex;
            background-color: lightcoral;
            flex-flow: row wrap;

           
        }
        div.item {
            background-color: lightskyblue;
            text-align: center;
            
            border: 1px solid black;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Maior que o normal</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">Bem maior que não vai dar e vai quebrar</div> 
        <div class="item">E</div>
        <div class="item">Maior ainda xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</div>
        <div class="item">G</div>
    </div>

    
</body>
</html>
